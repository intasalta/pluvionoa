<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pluviométrico - INTA</title>
    <!-- Lucide Icons & Google Fonts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Leaflet CSS y JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --accent-primary: #3b82f6;
            --radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-primary); color: var(--text-main); padding: 24px; }

        .header {
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            padding: 20px 28px; border-radius: var(--radius); border: 1px solid var(--border);
            margin-bottom: 24px; display: flex; align-items: center; gap: 16px;
        }

        .filters-bar {
            background: var(--bg-card); padding: 16px 24px; border-radius: var(--radius);
            border: 1px solid var(--border); margin-bottom: 24px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap;
        }

        .filter-group { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; }
        select, input {
            padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);
            background: var(--bg-primary); color: var(--text-main); outline: none;
        }

        .map-card {
            background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border);
            padding: 20px; margin-bottom: 24px; box-shadow: var(--shadow);
        }
        #map { height: 400px; width: 100%; border-radius: 8px; border: 1px solid var(--border); }

        .table-card {
            background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border);
            padding: 20px; box-shadow: var(--shadow); overflow-x: auto;
        }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
        th { padding: 12px 16px; background: var(--bg-primary); color: var(--text-muted); border-bottom: 2px solid var(--border); }
        td { padding: 12px 16px; border-bottom: 1px solid var(--border); }
        .precip-val { font-weight: 700; color: var(--accent-primary); }
        .loading-text { font-size: 14px; color: var(--text-muted); padding: 10px 0; }
    </style>
</head>
<body>

    <div class="header">
        <i data-lucide="cloud-rain" style="width:36px; height:36px; color: var(--accent-primary);"></i>
        <div>
            <h1 style="font-size: 22px;">Acumulados Pluviométricos Dinámicos</h1>
            <p style="font-size: 13px; color: var(--text-muted);">Monitoreo en tiempo real - INTA Salta / Jujuy</p>
        </div>
    </div>

    <div class="filters-bar">
        <div class="filter-group">
            <label><i data-lucide="map-pin"></i> Provincia:</label>
            <select id="provinceSelect" onchange="applyFilters()">
                <option value="Todas">Todas</option>
                <option value="Salta" selected>Salta</option>
                <option value="Jujuy">Jujuy</option>
            </select>
        </div>
        <div class="filter-group" style="margin-left: auto;">
            <label><i data-lucide="search"></i> Buscar:</label>
            <input type="text" id="searchInput" onkeyup="applyFilters()" placeholder="Filtrar por pluviómetro...">
        </div>
    </div>

    <!-- Mapa -->
    <div class="map-card">
        <h3 style="font-size: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px;">
            <i data-lucide="map"></i> Red de Pluviómetros Activos
        </h3>
        <div id="map"></div>
    </div>

    <!-- Tabla -->
    <div class="table-card">
        <div id="loadingStatus" class="loading-text">Obteniendo datos de KoboToolbox...</div>
        <table id="dataTable" style="display: none;">
            <thead>
                <tr>
                    <th>Año - Mes</th><th>Pluviómetro</th><th>Departamento</th><th>Provincia</th><th>Lluvia (mm)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>

    <script>
        const API_ENDPOINT = "./data_acumulados.json"; 

        let map, markersGroup;
        let globalPluviometros = [];

        function initMap() {
            map = L.map('map').setView([-24.5, -64.8], 7);

            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; OpenStreetMap contributors',
                maxZoom: 18
            }).addTo(map);

            markersGroup = L.layerGroup().addTo(map);
        }

        async function fetchOnlineSubmissions() {
            try {
                const response = await fetch(API_ENDPOINT);
                const rawData = await response.json();
                
                globalPluviometros = rawData.map(item => {
                    const mesFormateado = item.Mes < 10 ? `0${item.Mes}` : item.Mes;
                    return {
                        nombre: item["Pluviómetro"] || "Sin Nombre",
                        dpto: item["Departamento"] || "-",
                        prov: item["Provincia"] || "-",
                        lluvia: parseFloat(item["mm"] || 0),
                        fecha: `${item["Año"]}-${mesFormateado}`,
                        lat: item["lat"],
                        lng: item["lng"]
                    };
                });

                document.getElementById('loadingStatus').style.display = 'none';
                document.getElementById('dataTable').style.display = 'table';
                applyFilters();

            } catch (error) {
                console.error("Error cargando los datos:", error);
                document.getElementById('loadingStatus').innerText = "Error cargando la red de pluviómetros.";
            }
        }

        function applyFilters() {
            const selectedProv = document.getElementById('provinceSelect').value;
            const searchVal = document.getElementById('searchInput').value.toLowerCase();

            const filtered = globalPluviometros.filter(item => {
                const matchProv = selectedProv === "Todas" || item.prov.toLowerCase().includes(selectedProv.toLowerCase());
                const matchSearch = item.nombre.toLowerCase().includes(searchVal) || item.dpto.toLowerCase().includes(searchVal);
                return matchProv && matchSearch;
            });

            renderTable(filtered);
            renderMapMarkers(filtered);
        }

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.fecha}</td>
                    <td><strong>${item.nombre}</strong></td>
                    <td>${item.dpto}</td>
                    <td>${item.prov}</td>
                    <td class="precip-val">${item.lluvia.toFixed(1)} mm</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderMapMarkers(data) {
            markersGroup.clearLayers();

            data.forEach(item => {
                if (item.lat && item.lng) {
                    const marker = L.circleMarker([item.lat, item.lng], {
                        radius: 8,
                        fillColor: "#3b82f6",
                        color: "#ffffff",
                        weight: 2,
                        opacity: 1,
                        fillOpacity: 0.85
                    });

                    marker.bindPopup(`
                        <div style="color: #0f172a; font-family: sans-serif;">
                            <strong style="font-size: 14px;">${item.nombre}</strong><br>
                            <small>${item.dpto}, ${item.prov}</small><br><br>
                            Acumulado: <b style="color: #00529c;">${item.lluvia.toFixed(1)} mm</b>
                        </div>
                    `);

                    markersGroup.addLayer(marker);
                }
            });
        }

        window.onload = () => {
            lucide.createIcons();
            initMap();
            fetchOnlineSubmissions();
        };
    </script>
</body>
</html>
