<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Pluviométrico - INTA</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.6/css/dataTables.bootstrap5.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container py-4">
    <div class="d-flex align-items-center mb-4">
        <h2 class="text-primary fw-bold m-0">🌧️ Acumulados Pluviométricos</h2>
    </div>

    <!-- Filtros -->
    <div class="card shadow-sm mb-4">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label fw-bold">Filtrar por Año</label>
                    <select id="selectAnio" class="form-select">
                        <option value="">Todos los años</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-bold">Filtrar por Provincia</label>
                    <select id="selectProv" class="form-select">
                        <option value="">Todas las provincias</option>
                    </select>
                </div>
            </div>
        </div>
    </div>

    <!-- Tabla -->
    <div class="card shadow-sm">
        <div class="card-body">
            <div class="table-responsive">
                <table id="tablaPluvio" class="table table-striped align-middle" style="width:100%">
                    <thead class="table-dark">
                        <tr>
                            <th>Año</th>
                            <th>Mes</th>
                            <th>Pluviómetro</th>
                            <th>Departamento</th>
                            <th>Provincia</th>
                            <th>Lluvia (mm)</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.6/js/dataTables.bootstrap5.min.js"></script>

<script>
$(document).ready(function() {
    fetch('data_acumulados.json')
        .then(res => res.json())
        .then(data => {
            const meses = ["Ene", "Feb", "Mar", "Abr", "May", "Jun", "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"];
            
            // Llenar selectores únicos
            const anios = [...new Set(data.map(d => d.Año))].sort((a,b) => b-a);
            const provs = [...new Set(data.map(d => d.Provincia))].sort();

            anios.forEach(a => $('#selectAnio').append(`<option value="${a}">${a}</option>`));
            provs.forEach(p => $('#selectProv').append(`<option value="${p}">${p}</option>`));

            // Datatable init
            const table = $('#tablaPluvio').DataTable({
                data: data,
                columns: [
                    { data: 'Año' },
                    { data: 'Mes', render: m => meses[m-1] || m },
                    { data: 'Pluviómetro' },
                    { data: 'Departamento' },
                    { data: 'Provincia' },
                    { data: 'mm', render: d => `<b>${parseFloat(d).toFixed(1)} mm</b>` }
                ],
                order: [[0, 'desc'], [1, 'asc']],
                language: { url: 'https://cdn.datatables.net/plug-ins/1.13.6/i18n/es-ES.json' }
            });

            // Filtros dinámicos
            $('#selectAnio').on('change', function() {
                table.column(0).search(this.value).draw();
            });
            $('#selectProv').on('change', function() {
                table.column(4).search(this.value).draw();
            });
        });
});
</script>
</body>
</html>
